name: CI - Maven Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Run Maven tests and generate site
        run: ./mvnw -B clean test site
        env:
          TZ: UTC

      - name: Upload Surefire report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/site/surefire-report.html

      - name: Upload reports folder (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
