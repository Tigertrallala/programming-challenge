<section id="run">
  <h2>How to Build & Run</h2>
  <ul>
    <li><b>Build:</b> <code>./mvnw clean compile</code></li>
    <li><b>Run:</b> <code>./mvnw exec:java</code> <span class="badge">uses default data</span></li>
    <li><b>Custom files:</b> <code>./mvnw exec:java -Dexec.args="weather.csv countries.csv"</code></li>
  </ul>
  <p>Results are printed to the console. Errors and progress are logged.</p>
</section>
